<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1">
<title>Twibbon — SMA Negeri 1 Purwoasri</title>
<link rel="icon" type="image/png" href="/assets/favicon.png">
<link rel="shortcut icon" href="/assets/favicon.ico">
<link rel="apple-touch-icon" href="/assets/apple-touch-icon.png">
<link rel="stylesheet" href="/style.css">
<style>
body{background:radial-gradient(circle at 20% 0%,#1d4a80,var(--navy) 55%);min-height:100vh}
.wrap{max-width:560px;margin:0 auto;padding:18px 14px 40px}
.head{display:flex;gap:12px;align-items:center;color:#fff;margin-bottom:14px}.head img{width:40px}.head b{color:var(--gold);letter-spacing:.08em}
#cv{width:100%;aspect-ratio:1;border-radius:12px;touch-action:none;cursor:grab;background:repeating-conic-gradient(#e9edf3 0 25%,#f6f8fb 0 50%) 0 0/22px 22px;display:block}
input[type=range]{width:100%}
</style>
</head>
<body>
<div class="wrap">
  <div class="head"><img src="/assets/logo-sekolah.png" alt=""><div><b>TWIBBON</b><div class="small" style="opacity:.85">SMA Negeri 1 Purwoasri</div></div></div>
  <div class="card" id="box"><div class="empty">Memuat…</div></div>
</div>
<script type="module">
import { esc, loadImg, downloadBlob } from '/js/core.js';
const q = new URLSearchParams(location.search);
const box = document.getElementById('box');
const res = await fetch(`/api/public/twibbon/${q.get('h')}/${q.get('y')}`);
const d = await res.json();
if (!res.ok) { box.innerHTML = `<div class="empty">${esc(d.error || 'Twibbon tidak ditemukan')}</div>`; }
else {
  box.innerHTML = `<h2>${esc(d.nama)} ${d.tahun}</h2><p class="small muted" style="margin-top:0">${esc(d.tema || '')}</p>
    <canvas id="cv" width="1080" height="1080"></canvas>
    <div class="grid" style="gap:10px;margin-top:12px">
      <label class="btn primary" style="justify-content:center">📷 Pilih foto<input type="file" accept="image/*" id="file" hidden></label>
      <label class="small">Perbesar / perkecil<input type="range" id="zoom" min="0.3" max="3" step="0.01" value="1"></label>
      <p class="small muted" style="margin:0">Geser foto untuk mengatur posisi.</p>
      <button class="btn gold" id="dl" style="justify-content:center">⬇ Unduh hasil</button>
      <p class="small muted center" style="margin:0">Jangan lupa tag <b>@${esc(d.instagram)}</b> saat mengunggah 🙌</p>
    </div>`;
  const cv = document.getElementById('cv'), ctx = cv.getContext('2d');
  const frame = await loadImg('/api/file/' + d.frame);
  let photo = null, z = 1, ox = 0, oy = 0, drag = null;
  const base = () => (photo ? Math.max(1080 / photo.width, 1080 / photo.height) : 1);
  function draw() {
    ctx.clearRect(0, 0, 1080, 1080);
    if (photo) { const s = base() * z, w = photo.width * s, h = photo.height * s; ctx.drawImage(photo, 540 - w / 2 + ox, 540 - h / 2 + oy, w, h); }
    ctx.drawImage(frame, 0, 0, 1080, 1080);
  }
  draw();
  document.getElementById('file').onchange = async (e) => { const f = e.target.files[0]; if (!f) return; photo = await loadImg(URL.createObjectURL(f)); z = 1; ox = oy = 0; document.getElementById('zoom').value = 1; draw(); };
  document.getElementById('zoom').oninput = (e) => { z = +e.target.value; draw(); };
  const k = () => 1080 / cv.getBoundingClientRect().width;
  cv.addEventListener('pointerdown', (e) => { drag = { x: e.clientX, y: e.clientY, ox, oy }; cv.setPointerCapture(e.pointerId); });
  cv.addEventListener('pointermove', (e) => { if (!drag) return; ox = drag.ox + (e.clientX - drag.x) * k(); oy = drag.oy + (e.clientY - drag.y) * k(); draw(); });
  cv.addEventListener('pointerup', () => (drag = null));
  cv.addEventListener('wheel', (e) => { e.preventDefault(); z = Math.min(3, Math.max(0.3, z * (e.deltaY < 0 ? 1.05 : 0.95))); document.getElementById('zoom').value = z; draw(); }, { passive: false });
  document.getElementById('dl').onclick = () => { if (!photo) return alert('Pilih foto terlebih dahulu.'); cv.toBlob((b) => downloadBlob(b, `Twibbon ${d.nama} ${d.tahun}.png`), 'image/png'); };
}
</script>
</body>
</html>
